name: Build APK

# কখন চলবে: নিচের ফাইল বদলালে অটো, অথবা Actions ট্যাব থেকে "Run workflow" চেপে হাতে।
on:
  workflow_dispatch:
  push:
    paths:
      - 'version.json'
      - 'icon-512.png'
      - 'maskable-512.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: user,  name: "Daily Deal",       pkg: "com.dailydeal.shop",  page: "index.html",     iconp: "",       file: "DailyDeal.apk" }
          - { id: admin, name: "Daily Deal Admin", pkg: "com.dailydeal.admin", page: "admin-app.html", iconp: "admin-", file: "DailyDeal-Admin.apk" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" \vert{} base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PASS=$KS_PASS_SECRET" >> $GITHUB_ENV
          else
            echo "::warning::KEYSTORE_BASE64 secret নেই — অস্থায়ী কী দিয়ে সাইন হচ্ছে। এই APK-র ওপর আপডেট ইনস্টল হবে না, আগে আনইনস্টল করতে হবে।"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias dd -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tempass123 -keypass tempass123 -dname "CN=DailyDeal"
            echo "KS_PASS=tempass123" >> $GITHUB_ENV
          fi
          echo "KS_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Generate Android project
        env:
          APP_NAME: ${{ matrix.name }}
          PKG: ${{ matrix.pkg }}
          PAGE: ${{ matrix.page }}
          ICONP: ${{ matrix.iconp }}
          APP_URL_VAR: ${{ vars.APP_URL }}
        run: |
          set -e
          
          # ইমেজ ম্যাজিক ইনস্টল করা হচ্ছে (convert কমান্ডের জন্য)
          sudo apt-get update && sudo apt-get install -y imagemagick

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BASE="${APP_URL_VAR:-https://$OWNER.github.io/$REPO/}"
          case "$BASE" in */) ;; *) BASE="$BASE/";; esac
          IV=$(jq -r '.iconVersion // 1' version.json)
          START="${BASE}${PAGE}?iv=${IV}"
          HOST=$(echo "$BASE" | sed -E 's#https://([^/]+)/.*#\1#')
          echo "START_URL=$START"
          mkdir -p android && cd android
          PKGDIR="app/src/main/java/$(echo$PKG | tr . /)"
          mkdir -p "$PKGDIR" app/src/main/res/mipmap-anydpi-v26 app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "ddapp"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties

          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
            namespace '$PKG'
            compileSdk 34
            defaultConfig {
              applicationId '$PKG'
              minSdk 24
              targetSdk 34
              versionCode ${GITHUB_RUN_NUMBER}
              versionName '1.0.${GITHUB_RUN_NUMBER}'
            }
            signingConfigs {
              release {
                storeFile file(System.getenv('KS_FILE'))
                storePassword System.getenv('KS_PASS')
                keyAlias 'dd'
                keyPassword System.getenv('KS_PASS')
              }
            }
            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
          sed -i 's/^          //' settings.gradle build.gradle app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application
              android:label="$APP_NAME"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher"
              android:allowBackup="false"
              android:usesCleartextTraffic="false"
              android:theme="@style/AppTheme">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|uiMode|density"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          sed -i 's/^          //' app/src/main/AndroidManifest.xml

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
              <item name="android:windowBackground">#0B0A09</item>
              <item name="android:statusBarColor">#0B0A09</item>
              <item name="android:navigationBarColor">#0B0A09</item>
            </style>
          </resources>
          EOF
          sed -i 's/^          //' app/src/main/res/values/styles.xml
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="ic_bg">#0C0B0A</color></resources>
          EOF
          sed -i 's/^          //' app/src/main/res/values/colors.xml
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_bg"/>
            <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          sed -i 's/^          //' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          # আইকন: রেপোর PNG থেকে
          cp "../${ICONP}icon-192.png" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert "../${ICONP}maskable
